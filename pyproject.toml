[project]
name = "aus-data-jobs-radar"
version = "1.0.0"
description = "End-to-end data platform for the Australian data-job market"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "transform/dbt_project/target", "data"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "DTZ",  # timezone-aware datetimes
    "RUF",
]
ignore = [
    "E501",  # line length is handled by the formatter, not enforced hard
]

[tool.ruff.lint.per-file-ignores]
# The en-dash and non-breaking space in these regexes are NOT typos: real
# SEEK salary strings use "–" ("$60,000 – $70,000") and "&nbsp;". Matching
# the plain hyphen alone would silently miss most salary ranges.
"transform/parsers.py" = ["RUF001"]
# Same reason: these tests assert against verbatim real-world salary strings.
"tests/test_parsers.py" = ["RUF001"]
# The en-dash is intentional typography in the generated post copy.
"serve/linkedin_post.py" = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["transform"]
